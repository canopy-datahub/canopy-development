version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.1
    container_name: keycloak-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "8180:8080"  # Using 8180 to avoid conflicts
    volumes:
      - keycloak-data:/opt/keycloak/data

volumes:
  keycloak-data:


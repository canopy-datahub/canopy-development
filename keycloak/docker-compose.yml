services:
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.1
    container_name: keycloak-dev
    command: ["start-dev", "--health-enabled=true"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - keycloak-data:/opt/keycloak/data

volumes:
  keycloak-data:
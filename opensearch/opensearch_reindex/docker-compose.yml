services:
 datahub-opensearch:
   image: opensearchproject/opensearch:2.11.1
   environment:
     - discovery.type=single-node
     - bootstrap.memory_lock=true
     - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
     - "DISABLE_SECURITY_PLUGIN=true"
     - "DISABLE_INSTALL_DEMO_CONFIG=true"
   ports:
     - "9200:9200"
     - "9600:9600"
   ulimits:
     memlock:
       soft: -1
       hard: -1
   volumes:
     - datahub-opensearch-data:/usr/share/opensearch/data

 datahub-opensearch-dashboards:
   image: opensearchproject/opensearch-dashboards:2.11.1
   ports:
     - "5601:5601"
   environment:
     - 'OPENSEARCH_HOSTS=["http://datahub-opensearch:9200"]'
     - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
   depends_on:
     - datahub-opensearch

volumes:
 datahub-opensearch-data:
